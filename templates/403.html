{% extends 'base.html' %}
{% block title %}Access Denied - ResumeHero.ai{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6 text-center">
        <div class="glass-card py-5 border border-secondary border-opacity-10">
            <div class="d-inline-flex p-4 rounded-circle bg-danger bg-opacity-10 text-danger mb-4 border border-danger border-opacity-20">
                <i class="bi bi-shield-slash-fill" style="font-size: 3rem;"></i>
            </div>
            <h1 class="display-5 text-white mb-3 fw-bold" style="font-family: 'Space Grotesk', sans-serif;">403 - Access Denied</h1>
            <p class="text-muted mb-4 px-3 fs-5">
                You do not have permission to access this resource. Please make sure you are logged in with the correct account.
            </p>
            <a href="{% url 'home' %}" class="btn btn-primary-custom px-5 py-3">
                <i class="bi bi-house-door-fill me-2"></i> Back to Homepage
            </a>
        </div>
    </div>
</div>
{% endblock %}
