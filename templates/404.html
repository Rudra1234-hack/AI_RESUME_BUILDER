{% extends 'base.html' %}
{% block title %}Page Not Found - ResumeHero.ai{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6 text-center">
        <div class="glass-card py-5 border border-secondary border-opacity-10">
            <div class="d-inline-flex p-4 rounded-circle bg-warning bg-opacity-10 text-warning mb-4 border border-warning border-opacity-20">
                <i class="bi bi-exclamation-triangle" style="font-size: 3rem;"></i>
            </div>
            <h1 class="display-5 text-white mb-3 fw-bold" style="font-family: 'Space Grotesk', sans-serif;">404 - Page Not Found</h1>
            <p class="text-muted mb-4 px-3 fs-5">
                The resource you are looking for might have been removed, had its name changed, or is temporarily unavailable.
            </p>
            <a href="{% url 'home' %}" class="btn btn-primary-custom px-5 py-3">
                <i class="bi bi-house-door-fill me-2"></i> Back to Homepage
            </a>
        </div>
    </div>
</div>
{% endblock %}
