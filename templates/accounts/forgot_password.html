{% extends 'base.html' %}
{% block title %}Forgot Password - ResumeHero AI{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="glass-card animate-fade-in">
            <h2 class="text-center mb-3 text-white">Reset Password</h2>
            <p class="text-center text-muted mb-4 small">Enter your email address and we'll send you a link to reset your password.</p>
            <form method="post" action="{% url 'forgot_password' %}">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="email" class="form-label form-label-custom">Email Address</label>
                    <input type="email" name="email" id="email" class="form-control form-control-custom" placeholder="Enter your email" required>
                </div>
                <button type="submit" class="btn btn-primary-custom w-100 py-2">Send Reset Link</button>
            </form>
            <p class="text-center text-muted mt-4 mb-0 small">
                Remember your password? <a href="{% url 'login' %}" class="text-primary text-decoration-none fw-semibold">Sign In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
