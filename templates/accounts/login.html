{% extends 'base.html' %}
{% block title %}Login - ResumeHero AI{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="glass-card animate-fade-in">
            <h2 class="text-center mb-4 text-white">Welcome Back</h2>
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_username" class="form-label form-label-custom">Username</label>
                    <input type="text" name="username" autofocus maxlength="150" class="form-control form-control-custom" placeholder="Enter your username" required id="id_username">
                </div>
                <div class="mb-3">
                    <label for="id_password" class="form-label form-label-custom">Password</label>
                    <input type="password" name="password" class="form-control form-control-custom" placeholder="Enter your password" required id="id_password">
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <a href="{% url 'forgot_password' %}" class="text-primary text-decoration-none small">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary-custom w-100 py-2">Sign In</button>
            </form>
            <p class="text-center text-muted mt-4 mb-0 small">
                Don't have an account? <a href="{% url 'register' %}" class="text-primary text-decoration-none fw-semibold">Sign Up</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
