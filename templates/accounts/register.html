{% extends 'base.html' %}
{% block title %}Register - ResumeHero AI{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card animate-fade-in">
            <h2 class="text-center mb-4 text-white">Create Account</h2>
            <form method="post" action="{% url 'register' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_username" class="form-label form-label-custom">Username</label>
                    {{ form.username }}
                </div>
                <div class="mb-3">
                    <label for="id_email" class="form-label form-label-custom">Email Address</label>
                    {{ form.email }}
                </div>
                <div class="mb-3">
                    <label for="id_password" class="form-label form-label-custom">Password</label>
                    {{ form.password }}
                </div>
                <div class="mb-3">
                    <label for="id_password_confirm" class="form-label form-label-custom">Confirm Password</label>
                    {{ form.password_confirm }}
                </div>
                <button type="submit" class="btn btn-primary-custom w-100 py-2 mt-2">Sign Up</button>
            </form>
            <p class="text-center text-muted mt-4 mb-0 small">
                Already have an account? <a href="{% url 'login' %}" class="text-primary text-decoration-none fw-semibold">Sign In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
